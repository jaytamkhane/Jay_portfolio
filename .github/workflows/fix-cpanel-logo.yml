name: Fix cPanel logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace cPanel text mark with logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="tool-logo"><span style="font-weight:800;color:#3158ff;font-size:17px;">cP</span></div>'
          new = '<div class="tool-logo"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/cpanel.svg" alt="cPanel logo"></div>'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use cPanel brand logo"
          git push
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/fix-cpanel-logo.yml
          git add -A
          git commit -m "Remove one-time cPanel workflow"
          git push
