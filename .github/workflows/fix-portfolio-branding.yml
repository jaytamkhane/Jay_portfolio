name: Fix portfolio branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested branding fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="brand">Jay<span>.</span></div>', '<div class="brand">Jay Tamkhane</div>')
          for slug in ['openai', 'claude', 'freepik', 'elevenlabs', 'meta', 'googleanalytics', 'wordpress', 'canva']:
              s = s.replace(f'https://cdn.simpleicons.org/{slug}/17151a', f'https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/{slug}.svg')
              s = s.replace(f'https://cdn.simpleicons.org/{slug}/7a45f5', f'https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/{slug}.svg')
              s = s.replace(f'https://cdn.simpleicons.org/{slug}/ff6b5f', f'https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/{slug}.svg')
              s = s.replace(f'https://cdn.simpleicons.org/{slug}/3158ff', f'https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/{slug}.svg')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use original tool logos and full name in header"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/fix-portfolio-branding.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove one-time branding workflow"
          git push
