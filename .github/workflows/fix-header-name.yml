name: Fix header name

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace header brand
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a class="brand" href="#top">Jay<span>.</span></a>', '<a class="brand" href="#top">Jay Tamkhane</a>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use full name in portfolio header"
          git push
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/fix-header-name.yml
          git add -A
          git commit -m "Remove one-time header workflow"
          git push
